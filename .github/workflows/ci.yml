name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: go1.26.7

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned contract tooling
        run: npm ci --ignore-scripts
      - name: Run aggregate verification
        run: make verify

  image:
    name: Hardened image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build image
        run: make image
      - name: Exercise hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name thinkpixelmp-ci \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --publish 127.0.0.1:18080:8080 \
            thinkpixelmp:dev
          trap 'docker rm --force thinkpixelmp-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/livez; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs thinkpixelmp-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' thinkpixelmp-ci)" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' thinkpixelmp-ci)" = 'true'
          test "$(docker inspect --format '{{index .HostConfig.CapDrop 0}}' thinkpixelmp-ci)" = 'ALL'
          test "$(docker inspect --format '{{index .HostConfig.SecurityOpt 0}}' thinkpixelmp-ci)" = 'no-new-privileges'

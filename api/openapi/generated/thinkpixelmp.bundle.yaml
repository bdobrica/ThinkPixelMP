    mcp-server-descriptor-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/mcp-server-descriptor/v1
      title: ThinkPixelMP MCPServerDescriptor v1
      type: object
      additionalProperties: false
      required:
        - schema_version
        - kind
        - artifact
        - requirements
        - dependencies
        - spec
      properties:
        schema_version:
          const: 1
        kind:
          const: mcp-server
        artifact:
          $ref: '#/components/schemas/coordinates'
        requirements:
          $ref: '#/components/schemas/artifact-requirement-v1.schema'
        dependencies:
          $ref: '#/components/schemas/dependencies'
        spec:
          type: object
          additionalProperties: false
          required:
            - protocol_compatibility
            - delivery
            - authentication
          properties:
            protocol_compatibility:
              type: string
              minLength: 1
              maxLength: 128
            delivery:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - mode
                    - transport
                    - image
                  properties:
                    mode:
                      const: oci
                    transport:
                      const: stdio
                    image:
                      type: object
                      additionalProperties: false
                      required:
                        - reference
                        - digest
                      properties:
                        reference:
                          type: string
                          minLength: 73
                          maxLength: 2048
                          pattern: ^[A-Za-z0-9._:/-]+@sha256:[a-f0-9]{64}$
                        digest:
                          $ref: '#/components/schemas/sha256Digest'
                - type: object
                  additionalProperties: false
                  required:
                    - mode
                    - transport
                    - endpoint
                  properties:
                    mode:
                      const: remote
                    transport:
                      const: streamable-http
                    endpoint:
                      type: string
                      format: uri
                      maxLength: 2048
                      pattern: ^https://
            authentication:
              type: array
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required:
                  - type
                  - name
                  - required
                properties:
                  type:
                    type: string
                    enum:
                      - none
                      - oauth2
                      - oidc
                      - api-key
                      - mtls
                  name:
                    $ref: '#/components/schemas/dnsToken'
                  required:
                    type: boolean
            tools:
              type: array
              maxItems: 1024
              items:
                type: object
                additionalProperties: false
                required:
                  - name
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  description:
                    type: string
                    maxLength: 4096
                  input_schema_digest:
                    $ref: '#/components/schemas/sha256Digest'
    remote-agent-descriptor-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/remote-agent-descriptor/v1
      title: ThinkPixelMP RemoteAgentDescriptor v1
      type: object
      additionalProperties: false
      required:
        - schema_version
        - kind
        - artifact
        - requirements
        - dependencies
        - spec
      properties:
        schema_version:
          const: 1
        kind:
          const: remote-agent
        artifact:
          $ref: '#/components/schemas/coordinates'
        requirements:
          $ref: '#/components/schemas/artifact-requirement-v1.schema'
        dependencies:
          $ref: '#/components/schemas/dependencies'
        spec:
          type: object
          additionalProperties: false
          required:
            - agent_card
            - normalized
          properties:
            agent_card:
              type: object
              additionalProperties: false
              required:
                - media_type
                - digest
                - size_bytes
                - layer_digest
              properties:
                media_type:
                  const: application/json
                digest:
                  $ref: '#/components/schemas/sha256Digest'
                size_bytes:
                  type: integer
                  minimum: 2
                layer_digest:
                  $ref: '#/components/schemas/sha256Digest'
                signature_reference:
                  type: string
                  minLength: 1
                  maxLength: 2048
            normalized:
              type: object
              additionalProperties: false
              required:
                - endpoint
                - protocol_version
                - skills
              properties:
                endpoint:
                  type: string
                  format: uri
                  maxLength: 2048
                  pattern: ^https://
                protocol_version:
                  $ref: '#/components/schemas/semver'
                skills:
                  type: array
                  maxItems: 1024
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                capabilities:
                  type: array
                  maxItems: 256
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
    bundle-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/bundle/v1
      title: ThinkPixelMP Bundle descriptor v1
      description: Author-facing composite descriptor. Effective requirements are resolved as the union of this descriptor and selected transitive components; incompatibility fails resolution.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - kind
        - artifact
        - requirements
        - dependencies
        - spec
      properties:
        schema_version:
          const: 1
        kind:
          const: bundle
        artifact:
          $ref: '#/components/schemas/coordinates'
        requirements:
          $ref: '#/components/schemas/artifact-requirement-v1.schema'
        dependencies:
          $ref: '#/components/schemas/dependencies'
        spec:
          type: object
          additionalProperties: false
          required:
            - allowed_kinds
            - requirement_aggregation
          properties:
            allowed_kinds:
              type: array
              minItems: 1
              maxItems: 5
              uniqueItems: true
              items:
                type: string
                enum:
                  - skill
                  - agent-runtime
                  - mcp-server
                  - remote-agent
                  - bundle
            requirement_aggregation:
              const: transitive-union-fail-on-conflict-v1
    artifact-descriptor-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/artifact-descriptor/v1
      title: ThinkPixelMP ArtifactDescriptor v1
      description: Closed union of the five ThinkPixelMP artifact descriptor kinds.
      oneOf:
        - $ref: '#/components/schemas/skill-descriptor-v1.schema'
        - $ref: '#/components/schemas/agent-runtime-v1.schema'
        - $ref: '#/components/schemas/mcp-server-descriptor-v1.schema'
        - $ref: '#/components/schemas/remote-agent-descriptor-v1.schema'
        - $ref: '#/components/schemas/bundle-v1.schema'
      $defs:
        coordinates:
          type: object
          additionalProperties: false
          required:
            - namespace
            - name
            - version
          properties:
            namespace:
              $ref: '#/components/schemas/namespace'
            name:
              $ref: '#/components/schemas/dnsToken'
            version:
              $ref: '#/components/schemas/semver'
        requirements:
          $ref: '#/components/schemas/artifact-requirement-v1.schema'
        dependencies:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/artifact-dependency-v1.schema'
    node-2:
      type: object
      additionalProperties: false
      required:
        - digest
        - artifact
        - version
        - kind
        - descriptor_digest
        - effective_requirement_digest
      properties:
        digest:
          $ref: '#/components/schemas/sha256Digest'
        artifact:
          $ref: '#/components/schemas/artifactIdentity'
        version:
          $ref: '#/components/schemas/semver'
        kind:
          type: string
          enum:
            - skill
            - agent-runtime
            - mcp-server
            - remote-agent
            - bundle
        descriptor_digest:
          $ref: '#/components/schemas/sha256Digest'
        effective_requirement_digest:
          $ref: '#/components/schemas/sha256Digest'
    edge:
      type: object
      additionalProperties: false
      required:
        - parent_digest
        - dependency_index
        - dependency_name
        - child_digest
      properties:
        parent_digest:
          $ref: '#/components/schemas/sha256Digest'
        dependency_index:
          type: integer
          minimum: 0
          maximum: 255
        dependency_name:
          $ref: '#/components/schemas/dnsToken'
        child_digest:
          $ref: '#/components/schemas/sha256Digest'
    artifact-lock-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/artifact-lock/v1
      title: ThinkPixelMP ArtifactLock v1
      description: Immutable dependency graph. lock_digest is SHA-256 over RFC 8785 canonical JSON with lock_digest omitted. Nodes and edges are sorted by their documented canonical keys before digesting.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - resolution_algorithm
        - root_digest
        - nodes
        - edges
        - context
        - created_at
        - lock_digest
      properties:
        schema_version:
          const: 1
        resolution_algorithm:
          const: thinkpixelmp-resolution-v1
        root_digest:
          $ref: '#/components/schemas/sha256Digest'
        nodes:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/node-2'
        edges:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/edge'
        context:
          type: object
          additionalProperties: false
          required:
            - catalog_id
            - catalog_snapshot_digest
            - policy_digest
            - evidence_snapshot_digest
          properties:
            catalog_id:
              $ref: '#/components/schemas/uuidV7'
            catalog_snapshot_digest:
              $ref: '#/components/schemas/sha256Digest'
            policy_digest:
              $ref: '#/components/schemas/sha256Digest'
            evidence_snapshot_digest:
              $ref: '#/components/schemas/sha256Digest'
        created_at:
          type: string
          format: date-time
        lock_digest:
          $ref: '#/components/schemas/sha256Digest'
      $defs:
        node:
          type: object
          additionalProperties: false
          required:
            - digest
            - artifact
            - version
            - kind
            - descriptor_digest
            - effective_requirement_digest
          properties:
            digest:
              $ref: '#/components/schemas/sha256Digest'
            artifact:
              $ref: '#/components/schemas/artifactIdentity'
            version:
              $ref: '#/components/schemas/semver'
            kind:
              type: string
              enum:
                - skill
                - agent-runtime
                - mcp-server
                - remote-agent
                - bundle
            descriptor_digest:
              $ref: '#/components/schemas/sha256Digest'
            effective_requirement_digest:
              $ref: '#/components/schemas/sha256Digest'
        edge:
          type: object
          additionalProperties: false
          required:
            - parent_digest
            - dependency_index
            - dependency_name
            - child_digest
          properties:
            parent_digest:
              $ref: '#/components/schemas/sha256Digest'
            dependency_index:
              type: integer
              minimum: 0
              maximum: 255
            dependency_name:
              $ref: '#/components/schemas/dnsToken'
            child_digest:
              $ref: '#/components/schemas/sha256Digest'
    catalog-snapshot-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/catalog-snapshot/v1
      title: ThinkPixelMP CatalogSnapshot v1
      description: Complete, self-contained immutable catalog view. The parent is ancestry metadata only. snapshot_digest is SHA-256 over RFC 8785 canonical JSON with snapshot_digest and signing_identity omitted.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - snapshot_id
        - tenant_id
        - catalog_id
        - created_at
        - entries
        - policy
        - lifecycle
        - snapshot_digest
        - signing_identity
      properties:
        schema_version:
          const: 1
        snapshot_id:
          $ref: '#/components/schemas/uuidV7'
        tenant_id:
          $ref: '#/components/schemas/uuidV7'
        catalog_id:
          $ref: '#/components/schemas/uuidV7'
        created_at:
          type: string
          format: date-time
        parent_snapshot_digest:
          $ref: '#/components/schemas/sha256Digest'
        entries:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required:
              - catalog_entry_id
              - artifact_version_id
              - artifact_digest
              - entry_state
              - promotion_decision_id
            properties:
              catalog_entry_id:
                $ref: '#/components/schemas/uuidV7'
              artifact_version_id:
                $ref: '#/components/schemas/uuidV7'
              artifact_digest:
                $ref: '#/components/schemas/sha256Digest'
              entry_state:
                type: string
                enum:
                  - active
                  - removed
              promotion_decision_id:
                $ref: '#/components/schemas/uuidV7'
              promotion_attestation_digest:
                $ref: '#/components/schemas/sha256Digest'
              resolution_digest:
                $ref: '#/components/schemas/sha256Digest'
              lock_digest:
                $ref: '#/components/schemas/sha256Digest'
              evidence_record_digests:
                type: array
                maxItems: 4096
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/sha256Digest'
              evidence_report_digests:
                type: array
                maxItems: 4096
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/sha256Digest'
        policy:
          type: object
          additionalProperties: false
          required:
            - bundle_digest
            - activation_digest
          properties:
            bundle_digest:
              $ref: '#/components/schemas/sha256Digest'
            activation_digest:
              $ref: '#/components/schemas/sha256Digest'
        lifecycle:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required:
              - artifact_digest
              - state
              - record_digest
            properties:
              artifact_digest:
                $ref: '#/components/schemas/sha256Digest'
              state:
                type: string
                enum:
                  - active
                  - deprecated
                  - quarantined
                  - revoked
              record_digest:
                $ref: '#/components/schemas/sha256Digest'
        snapshot_digest:
          $ref: '#/components/schemas/sha256Digest'
        signing_identity:
          type: string
          minLength: 1
          maxLength: 512
    artifactRegistered:
      properties:
        type:
          const: io.thinkpixel.mp.artifact.registered.v1
        data:
          type: object
          additionalProperties: false
          required:
            - tenant_id
            - transaction_cursor
            - artifact_version_id
            - artifact_digest
            - descriptor_digest
          properties:
            tenant_id:
              $ref: '#/components/schemas/uuidV7'
            transaction_cursor:
              type: string
              minLength: 1
              maxLength: 1024
            artifact_version_id:
              $ref: '#/components/schemas/uuidV7'
            artifact_digest:
              $ref: '#/components/schemas/sha256Digest'
            descriptor_digest:
              $ref: '#/components/schemas/sha256Digest'
    artifactLifecycle:
      properties:
        type:
          enum:
            - io.thinkpixel.mp.artifact.deprecated.v1
            - io.thinkpixel.mp.artifact.quarantined.v1
            - io.thinkpixel.mp.artifact.quarantine-released.v1
            - io.thinkpixel.mp.artifact.revoked.v1
        data:
          type: object
          additionalProperties: false
          required:
            - tenant_id
            - transaction_cursor
            - artifact_version_id
            - artifact_digest
            - previous_state
            - current_state
            - reason_code
          properties:
            tenant_id:
              $ref: '#/components/schemas/uuidV7'
            transaction_cursor:
              type: string
              minLength: 1
              maxLength: 1024
            artifact_version_id:
              $ref: '#/components/schemas/uuidV7'
            artifact_digest:
              $ref: '#/components/schemas/sha256Digest'
            previous_state:
              type: string
              enum:
                - active
                - deprecated
                - quarantined
            current_state:
              type: string
              enum:
                - active
                - deprecated
                - quarantined
                - revoked
            reason_code:
              type: string
              minLength: 1
              maxLength: 128
      oneOf:
        - properties:
            type:
              const: io.thinkpixel.mp.artifact.deprecated.v1
            data:
              properties:
                current_state:
                  const: deprecated
        - properties:
            type:
              const: io.thinkpixel.mp.artifact.quarantined.v1
            data:
              properties:
                current_state:
                  const: quarantined
        - properties:
            type:
              const: io.thinkpixel.mp.artifact.quarantine-released.v1
            data:
              properties:
                current_state:
                  const: active
        - properties:
            type:
              const: io.thinkpixel.mp.artifact.revoked.v1
            data:
              properties:
                current_state:
                  const: revoked
    evidenceAccepted:

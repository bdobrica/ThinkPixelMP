    evidence-record-v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.thinkpixel.io/thinkpixelmp/evidence-record/v1
      title: ThinkPixelMP EvidenceRecord v1
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - tenant_id
        - artifact_version_id
        - subject_digest
        - category
        - producer
        - producer_event_id
        - report
        - ingestion_status
        - created_at
        - observed_at
        - ingested_at
      properties:
        schema_version:
          const: 1
        id:
          $ref: '#/components/schemas/uuidV7'
        tenant_id:
          $ref: '#/components/schemas/uuidV7'
        artifact_version_id:
          $ref: '#/components/schemas/uuidV7'
        subject_digest:
          $ref: '#/components/schemas/sha256Digest'
        category:
          type: string
          enum:
            - publisher-verification
            - signature-verification
            - provenance
            - sbom
            - vulnerability-scan
            - malware-analysis
            - static-analysis
            - license-analysis
            - agent-evaluation
            - human-review
            - runtime-compatibility
            - endpoint-ownership
            - endpoint-tls
            - endpoint-health
        producer:
          type: object
          additionalProperties: false
          required:
            - id
            - version
          properties:
            id:
              $ref: '#/components/schemas/uuidV7'
            version:
              type: string
              minLength: 1
              maxLength: 255
        producer_event_id:
          type: string
          minLength: 1
          maxLength: 255
        report:
          type: object
          additionalProperties: false
          required:
            - digest
            - media_type
            - size_bytes
            - reference
          properties:
            digest:
              $ref: '#/components/schemas/sha256Digest'
            media_type:
              type: string
              minLength: 1
              maxLength: 255
            size_bytes:
              type: integer
              minimum: 0
            reference:
              type: string
              minLength: 1
              maxLength: 2048
        ingestion_status:
          type: string
          enum:
            - accepted
            - rejected
            - processing-error
        conclusion:
          type: string
          enum:
            - pass
            - fail
            - warning
            - unknown
            - not-applicable
        created_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        normalizer_profile:
          type: string
          minLength: 1
          maxLength: 255
        summary:
          $ref: '#/components/schemas/evidence-summary-v1.schema'
        reason_codes:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$
      allOf:
        - if:
            properties:
              ingestion_status:
                const: accepted
          then:
            required:
              - conclusion
              - normalizer_profile
              - summary
          else:
            not:
              required:
                - conclusion
        - oneOf:
            - $ref: '#/components/schemas/publisherVerification'
            - $ref: '#/components/schemas/signatureVerification'
            - $ref: '#/components/schemas/provenance'
            - $ref: '#/components/schemas/sbom'
            - $ref: '#/components/schemas/vulnerabilityScan'
            - $ref: '#/components/schemas/malwareAnalysis'
            - $ref: '#/components/schemas/staticAnalysis'
            - $ref: '#/components/schemas/licenseAnalysis'
            - $ref: '#/components/schemas/agentEvaluation'
            - $ref: '#/components/schemas/humanReview'
            - $ref: '#/components/schemas/runtimeCompatibility'
            - $ref: '#/components/schemas/endpointOwnership'
            - $ref: '#/components/schemas/endpointTls'
            - $ref: '#/components/schemas/endpointHealth'
        - if:
            properties:
              ingestion_status:
                const: accepted
              category:
                const: agent-evaluation
            required:
              - ingestion_status
              - category
          then:
            oneOf:
              - $ref: '#/components/schemas/evaluationPass'
              - $ref: '#/components/schemas/evaluationFail'

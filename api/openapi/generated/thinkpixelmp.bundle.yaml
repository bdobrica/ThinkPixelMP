                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - executable-file
                      - shebang
                      - binary-outside-assets
                      - skill-markdown-code
              allOf:
                - if:
                    properties:
                      artifact_class:
                        const: instructional
                  then:
                    properties:
                      reasons:
                        maxItems: 0
                - if:
                    properties:
                      artifact_class:
                        const: executable-local
                  then:
                    properties:
                      reasons:

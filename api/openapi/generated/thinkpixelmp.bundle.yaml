                      type: string
                      minLength: 1
                      maxLength: 2048
                    license:
                      type: string
                      minLength: 1
                      maxLength: 128
                    compatibility:
                      type: string
                      minLength: 1
                      maxLength: 500
            package:
              type: object
              additionalProperties: false
              required:
                - media_type
                - digest
                - size_bytes
                - file_count
              properties:
                media_type:
                  const: application/vnd.thinkpixel.skill.layer.v1+tar+gzip

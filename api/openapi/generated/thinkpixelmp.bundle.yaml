            - classification
          properties:
            source:
              type: object
              additionalProperties: false
              required:
                - path
                - digest
                - metadata
              properties:
                path:
                  const: SKILL.md
                digest:
                  $ref: '#/components/schemas/sha256Digest'
                metadata:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - description
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 128

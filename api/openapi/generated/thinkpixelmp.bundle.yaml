        data:
          type: object
          additionalProperties: false
          required:
            - tenant_id
            - transaction_cursor
            - catalog_id
            - catalog_entry_id
            - artifact_digest
            - previous_state
            - current_state
          properties:
            tenant_id:
              $ref: '#/components/schemas/uuidV7'
            transaction_cursor:
              type: string
              minLength: 1
              maxLength: 1024
            catalog_id:
              $ref: '#/components/schemas/uuidV7'
            catalog_entry_id:
              $ref: '#/components/schemas/uuidV7'
            artifact_digest:
              $ref: '#/components/schemas/sha256Digest'

name: thinkpixelmp

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: thinkpixelmp
      POSTGRES_USER: thinkpixelmp_migrator
      POSTGRES_PASSWORD: ${TPMP_POSTGRES_PASSWORD:?Set TPMP_POSTGRES_PASSWORD for the disposable development database}
    ports:
      - "127.0.0.1:${TPMP_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkpixelmp_migrator -d thinkpixelmp"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - thinkpixelmp-postgres:/var/lib/postgresql

volumes:
  thinkpixelmp-postgres:
